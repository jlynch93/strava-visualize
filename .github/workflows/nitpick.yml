# AI code review with open-nitpick (https://github.com/jdziat/open-nitpick).
#
# Model: either
# - Ollama on the self-hosted runner: repository variables NITPICK_PROVIDER =
#   ollama and NITPICK_MODEL = the model name from "ollama list". No key. If
#   Ollama is on another machine than the runner, also set OLLAMA_BASE_URL
#   (e.g. http://192.168.1.20:11434/v1); the default is localhost:11434.
# - A hosted provider (OpenRouter by default): the NITPICK_API_KEY secret.
# With neither, the job is skipped with a notice, not failed.
#
# - Pull requests: findings are posted as inline review comments.
# - Pushes to main: there is no pull request to comment on, so the review of
#   the pushed commits is written to the run's job summary in the Actions tab.
#
# Advisory only (fail-on: none): it never blocks a merge or marks a push red
# for its findings.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # contents: write is only for resolving review threads: GitHub refuses the
  # resolve call ("Resource not accessible by integration") with contents:
  # read, so outdated findings stayed open. The job runs the pinned nitpick
  # release and never executes code from the pull request, and forked pull
  # requests are not reviewed at all (see the job's if).
  contents: write
  pull-requests: write

concurrency:
  group: nitpick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Self-hosted runner by default; set the RUNS_ON repository variable to
    # ubuntu-latest to fall back to GitHub's runners while it is offline.
    # (Forked pull requests are not reviewed at all, see the if below.)
    runs-on: ${{ vars.RUNS_ON || 'self-hosted' }}
    # Local models on small hardware are slow; hosted ones finish in minutes.
    timeout-minutes: ${{ vars.NITPICK_PROVIDER == 'ollama' && 60 || 20 }}
    # Forked pull requests and Dependabot runs get no secrets, so they would
    # only fail with "API key is required".
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]'
    env:
      # A step's if cannot read secrets; it can read env.
      HAS_KEY: ${{ secrets.NITPICK_API_KEY != '' || vars.NITPICK_PROVIDER == 'ollama' }}
    steps:
      - name: No model key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::AI review skipped. Set NITPICK_PROVIDER=ollama (and NITPICK_MODEL) or add the NITPICK_API_KEY secret to turn it on."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0 # the reviewer diffs against the base branch or the pushed range

      # Runner-side config for Ollama, in a file outside the checkout that
      # nitpick trusts (NITPICK_USER_CONFIG). Two reasons it lives here:
      # - nitpick refuses a private or plain-HTTP base_url from the repository's
      #   own .nitpick.yaml, since a pull request could edit it;
      # - small local hardware needs small requests: only the changed lines
      #   (not whole files, which for public/script.js is ~55k tokens), no
      #   imported definitions, and one file per call within ~6k tokens, one
      #   call at a time (a small machine only queues parallel ones), so a
      #   request fits an 8k context and answers in minutes.
      - name: Ollama settings
        if: env.HAS_KEY == 'true' && vars.NITPICK_PROVIDER == 'ollama'
        env:
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
        run: |
          file="$RUNNER_TEMP/nitpick-runner.yaml"
          {
            if [ -n "$OLLAMA_BASE_URL" ]; then
              printf 'models:\n  default:\n    base_url: "%s"\n    allow_private_endpoint: true\n    timeout: 15m\n' "$OLLAMA_BASE_URL"
            else
              printf 'models:\n  default:\n    timeout: 15m\n'
            fi
            printf 'review:\n  include_full_files: false\n  related_context: false\n  max_files_per_request: 1\n  token_budget_per_request: 6000\n  concurrency: 1\n'
          } > "$file"
          cat "$file"
          echo "NITPICK_USER_CONFIG=$file" >> "$GITHUB_ENV"

      - uses: jdziat/open-nitpick@a32fa26e7231335da3179daf91a72b100e5e9bdb # v2.8.0
        if: env.HAS_KEY == 'true'
        env:
          # Runner-side model choice. These override .nitpick.yaml's model
          # (the action's provider/model inputs only fill in what that file
          # leaves unset); empty leaves the file's model in place.
          NITPICK_REVIEW_PROVIDER: ${{ vars.NITPICK_PROVIDER }}
          NITPICK_REVIEW_MODEL: ${{ vars.NITPICK_MODEL }}
          NITPICK_TRIAGE_MODEL: ${{ vars.NITPICK_MODEL }}
        with:
          version: v2.8.0
          api-key: ${{ secrets.NITPICK_API_KEY }}
          fail-on: none
          skip-drafts: true

name: Validate dashboard

on:
  push:
    branches: [main, codex/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Self-hosted runner by default; set the RUNS_ON repository variable to
    # ubuntu-latest to fall back to GitHub's runners while it is offline.
    # Pull requests from forks always use GitHub's runners: their code must
    # never run on the self-hosted machine.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNS_ON || 'self-hosted' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build fingerprinted assets
        run: npm run build
      - name: Check JavaScript syntax
        run: |
          node --check public/script.js
          node --check public/experience.js
          node --check public/training-core.js
          node --check public/fitness-core.js
          node --check public/fitness.js
          node --check public/charts.js
          node --check shared/services.cjs
          node --check shared/analysis-limits.cjs
          node --check server.js
          node --check scripts/d1-sqlite.js
          for file in $(find src -name "*.js"); do node --check "$file"; done
      - name: Check patch whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            echo "No parent commit in this shallow checkout; skipping patch diff."
          fi

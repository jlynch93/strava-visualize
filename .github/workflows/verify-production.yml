name: Verify production

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: Public production URL
        required: true
        default: https://strava.jeer.rest
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the active production release
        env:
          PRODUCTION_URL: ${{ inputs.production_url }}
        run: |
          base="${PRODUCTION_URL%/}"
          curl --fail --silent --show-error "$base/api/status" | grep -q 'configured'
          curl --fail --silent --show-error -H 'Accept: text/html' "$base/?release-check=${GITHUB_SHA}" | grep -q 'id="overviewTitle"'
          headers="$(curl --fail --silent --show-error -D - -o /dev/null -H 'Accept: text/html' "$base/?release-check=${GITHUB_SHA}")"
          printf '%s' "$headers" | grep -qi '^cache-control:.*no-store'
          manifest="$(curl --fail --silent --show-error "$base/asset-manifest.json")"
          for asset in $(printf '%s' "$manifest" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin).values()))'); do
            curl --fail --silent --show-error "$base/$asset" >/dev/null
          done
